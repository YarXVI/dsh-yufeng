<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>DSH 工具箱</title>
<style>
:root{color-scheme:dark}
body{margin:0;padding:20px;background:#1e1f22;color:#dbdee1;font:14px/1.5 system-ui,"Segoe UI",sans-serif}
.card{max-width:640px;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:16px 18px;background:#2b2d31;margin-bottom:14px}
h2{margin:0 0 12px;font-size:15px;color:#fff}
.row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.row label{width:110px;flex:0 0 auto;color:#949ba4;font-size:13px}
input[type=text],select{flex:1;padding:6px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.14);background:#1e1f22;color:#dbdee1;font:inherit;font-size:13px}
button{padding:6px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.14);background:#36393f;color:#dbdee1;font:inherit;font-size:13px;cursor:pointer}
button:hover{background:#40444b}
button.primary{background:#5865f2;border-color:#4752c4;color:#fff;font-weight:600}
button.primary:hover{background:#4752c4}
.note{color:#8b8f96;font-size:12px;margin-top:6px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
.badge.ok{background:rgba(35,165,90,.18);color:#3ba55d}
.badge.err{background:rgba(218,62,68,.18);color:#ed4245}
pre{background:#1e1f22;border-radius:6px;padding:10px;font-size:12px;overflow:auto;max-height:200px;color:#b5bac1}
</style></head><body>

<div class="card">
  <h2>Windows 划词转译</h2>
  <div class="row"><label>状态</label><span id="badge" class="badge">检测中…</span></div>
  <div class="row"><label>快捷键</label><input type="text" id="hotkey" placeholder="Ctrl+Shift+F"></div>
  <div class="row"><label>目标语言</label><select id="lang"></select></div>
  <div class="row"><label>模式</label><select id="mode">
    <option value="replace">替换原文（Ctrl+V 自动粘贴）</option>
    <option value="copy">只复制到剪贴板</option>
  </select></div>
  <div class="row"><label>翻译后端</label><select id="provider"></select></div>
  <div class="row"><label>API 地址</label><input type="text" id="baseUrl" placeholder="https://api.example.com/v1"></div>
  <div class="row"><label>模型名</label><input type="text" id="model" placeholder="translate"></div>
  <div class="row"><label>API Key</label><input type="password" id="apiKey" placeholder="sk-..."></div>
  <div class="row"><button id="test">测试连接</button></div>
  <div class="row">
    <button class="primary" id="save">保存并应用</button>
    <button id="run">手动跑一次</button>
    <button id="toggle">停用</button>
  </div>
  <div class="note">用法：在任何应用里划词选中 → 按快捷键 → 就地转译。剪贴板会临时占用，之后自动恢复。</div>
</div>

<div class="card">
  <h2>运行信息</h2>
  <pre id="info">加载中…</pre>
</div>

<script>
const $ = s => document.querySelector(s);
const API = "/plugins/dsh-yufeng/panel";
let cfg = {};

function render(st) {
  const svc = st.service || {};
  const b = $("#badge");
  if (!svc.ffi) { b.className = "badge err"; b.textContent = "FFI 不可用"; }
  else if (svc.running) { b.className = "badge ok"; b.textContent = "运行中"; }
  else { b.className = "badge err"; b.textContent = "已停用"; }

  cfg = st.config || {};
  if (!$("#hotkey").value) $("#hotkey").value = cfg.hotkey || "Ctrl+Shift+F";
  // provider 下拉
  const ps = cfg.providers || [];
  const selP = $("#provider");
  if (selP.options.length !== ps.length) {
    selP.innerHTML = "";
    for (const p of ps) {
      const o = document.createElement("option");
      o.value = p.id; o.textContent = p.name + (p.hasKey ? " ✓" : "");
      selP.appendChild(o);
    }
  }
  selP.value = cfg.activeProvider || (ps[0] && ps[0].id) || "";
  const cur = ps.find((p) => p.id === selP.value) || ps[0];
  if (cur) {
    if (document.activeElement !== $("#baseUrl")) $("#baseUrl").value = cur.baseUrl || "";
    if (document.activeElement !== $("#model")) $("#model").value = cur.model || "";
  }
  if (!$("#mode").value || $("#mode").value !== cfg.mode) $("#mode").value = cfg.mode || "replace";

  const sel = $("#lang");
  if (sel.options.length === 0) {
    for (const l of (st.langs || [])) {
      const o = document.createElement("option");
      o.value = l.id; o.textContent = l.zh;
      sel.appendChild(o);
    }
  }
  sel.value = cfg.lang || "en";

  $("#toggle").textContent = svc.running ? "停用" : "启用";
  $("#info").textContent = JSON.stringify({
    ffi: svc.ffi, source: svc.source, running: svc.running, busy: svc.busy,
    stats: svc.stats, last: svc.last
  }, null, 2);
}

async function refresh() {
  try {
    const r = await fetch(API + "/state").then(x => x.json());
    if (r.ok) render(r);
  } catch (e) { $("#info").textContent = "连不上面板 API: " + e.message; }
}

$("#save").onclick = async () => {
  const pid = $("#provider").value;
  const ps = (cfg.providers || []).map((p) =>
    p.id === pid ? Object.assign({}, p, { baseUrl: $("#baseUrl").value, model: $("#model").value }) : p
  );
  const body = {
    hotkey: $("#hotkey").value,
    lang: $("#lang").value,
    mode: $("#mode").value,
    activeProvider: pid,
    providers: ps,
  };
  const k = $("#apiKey").value.trim();
  if (k) { body.providerKeys = {}; body.providerKeys[pid] = k; }
  const r = await fetch(API + "/config", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) }).then(x=>x.json());
  if (r.ok) { $("#info").textContent = "已保存"; refresh(); }
  else $("#info").textContent = "保存失败: " + r.error;
};

$("#run").onclick = async () => {
  $("#info").textContent = "运行中…";
  const r = await fetch(API + "/run", { method:"POST", headers:{"Content-Type":"application/json"}, body: "{}" }).then(x=>x.json());
  $("#info").textContent = JSON.stringify(r, null, 2);
  refresh();
};

$("#toggle").onclick = async () => {
  const running = $("#toggle").textContent === "停用";
  await fetch(API + "/toggle", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ enabled: !running }) });
  refresh();
};

refresh();
setInterval(refresh, 2000);
</script>
</body></html>
