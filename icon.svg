<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="御风 YuFeng · dsh-toolbox">
  <defs>
    <linearGradient id="wind" x1="120" y1="160" x2="392" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DE2D1"/>
      <stop offset=".55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#B9F6F0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="#0B0C0F"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
  <circle cx="256" cy="256" r="148" fill="url(#glow)"/>

  <!--
    左：中文的「方块字」—— 实心方 + 内部两道留白（像两行文字排在一个方框里）
    右：外语的「横排」—— 三条不等长横线

    中间的空白本身就是「转换」：左与右之间什么都不画，
    留白比箭头更耐得住小尺寸（箭头缩到 18px 就变成一个点了）。
  -->
  <rect x="96" y="164" width="148" height="184" rx="30" fill="url(#wind)"/>
  <rect x="124" y="212" width="92" height="22" rx="11" fill="#0B0C0F" opacity=".5"/>
  <rect x="124" y="262" width="62" height="22" rx="11" fill="#0B0C0F" opacity=".5"/>

  <rect x="296" y="164" width="120" height="38" rx="19" fill="url(#wind)"/>
  <rect x="296" y="226" width="84" height="38" rx="19" fill="url(#wind)" opacity=".68"/>
  <rect x="296" y="288" width="104" height="38" rx="19" fill="url(#wind)" opacity=".42"/>
</svg>